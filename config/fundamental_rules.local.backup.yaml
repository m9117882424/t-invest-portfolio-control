# Fundamental filter rules.
# MVP: sectors and manual metrics are configurable; dividends are loaded from T-Invest API.
# T-Bank fundamentals are used as an automatic source when available.
# If T-Bank does not return multipliers for Russian shares, fill this manual block from trusted sources.

sector_limits:
  # Default limit for sectors that are not explicitly configured.
  default_max_percent: 0.35
  overrides:
    # SBER 30% + MOEX 15% are part of the target model, so financial sector limit must allow 45%.
    financial: 0.45
    energy: 0.25
    it: 0.20
    consumer: 0.15
    materials: 0.20

# Global fallback thresholds. Used when the sector has no specific override.
thresholds:
  report_wait_days: 5
  dividend_wait_days_before_last_buy: 7
  dividend_risk_days_after_record: 5
  max_pe: 25
  max_pb: 5
  min_roe_percent: 10
  max_debt_to_ebitda: 3
  max_ev_to_ebitda: 15

# Sector-specific metric thresholds.
# These values override the global thresholds only for the listed sector.
metric_thresholds_by_sector:
  financial:
    max_pe: 15
    max_pb: 3
    min_roe_percent: 15

  energy:
    max_pe: 25
    max_pb: 3
    min_roe_percent: 10
    max_ev_to_ebitda: 8
    max_debt_to_ebitda: 2.5

  materials:
    max_pe: 20
    max_pb: 15
    min_roe_percent: 10
    max_ev_to_ebitda: 10
    max_debt_to_ebitda: 2.5

  it:
    max_pe: 35
    max_pb: 10
    min_roe_percent: 10
    max_ev_to_ebitda: 20
    max_debt_to_ebitda: 2.5

  consumer:
    max_pe: 25
    max_pb: 12
    min_roe_percent: 10
    max_ev_to_ebitda: 12
    max_debt_to_ebitda: 3

# Manual report calendar until we wire an API/parser for earnings dates.
reports:
